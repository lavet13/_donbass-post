services:
  postgres:
    # Expose postgres to host in dev for local tools
    # (prisma studio, psql, TablePlus, etc.)
    ports:
      - "127.0.0.1:5434:5432"

  mysql:
    ports:
      - "127.0.0.1:3307:3306" # 3307 on host to avoid clashing if you run other mysql
    volumes:
      - ./mysql/init-dev/02-shadow-db.sh:/docker-entrypoint-initdb.d/02-shadow-db.sh:ro # shadow DB — dev only

  # Dev-only fake SMTP server + web inbox: catches every e-mail the bot sends
  mailpit:
    image: axllent/mailpit:v1.31.5 # latest release tag today (from the GitHub repo's tags)
    container_name: donbass-post-mailpit
    ports:
      - "127.0.0.1:8025:8025" # web inbox → http://localhost:8025 (127.0.0.1 = this machine only)
      - "127.0.0.1:1025:1025" # the SMTP port the bot connects to
