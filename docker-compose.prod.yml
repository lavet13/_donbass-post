services:
  # == Nginx + Certbot =========================================================
  # Pinned to match the nginx version in docker-compose.test.yml (nginx:1.28.0-alpine).
  nginx-certbot:
    image: jonasal/nginx-certbot:5.6.0-nginx1.28.0
    restart: unless-stopped
    ports:
      # Expose both HTTP and HTTPS to the internet
      - "80:80"
      - "443:443"
    environment:
      # Used by Certbot to obtain and renew certificates
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    volumes:
      # Where the image stores obtained certificates — persist across restarts
      - nginx_secrets:/etc/letsencrypt

      # Your nginx config files — we'll create this directory next
      - ./nginx/conf.d:/etc/nginx/user_conf.d

      # Static React files copied here by web-deploy.yml workflow
      - /var/www/donbass-post-web:/var/www/donbass-post-web:ro
    depends_on:
      - telegram-bot
    networks:
      - donbass-post-network

  # == Telegram Bot (Node.js) ==================================================
  telegram-bot:
    build:
      # Monorepo root as context so yarn can resolve all workspaces
      context: .
      dockerfile: apps/telegram-bot/Dockerfile
    restart: unless-stopped
    mem_limit: 500m
    env_file:
      # Same .env file your bot already uses
      - apps/telegram-bot/.env
      - apps/telegram-bot/.env.production
    depends_on:
      postgres:
        # Don't start the bot until postgres is actually ready to accept
        # connections — not just started
        condition: service_healthy
      mysql:
        # same for mysql
        condition: service_healthy
    networks:
      - donbass-post-network

  postgres:
    env_file:
      - apps/telegram-bot/.env
      - apps/telegram-bot/.env.production
    # Postgres has no public ports because it's only reached by the bot container
    # over the compose network
    ports: []
    expose:
      - "5432"

  mysql:
    env_file:
      - apps/telegram-bot/.env
      - apps/telegram-bot/.env.production
    ports:
      # ODBC clients (office PCs) connect from the internet → bind public, but
      # the firewall/allowlist is what actually restricts.
      # ODBC comment. 3306 public here (not 127.0.0.1) so external ODBC can reach.
      - "3306:3306"
      # NO shadow init mount (that's dev-only, in docker-compose.dev.yml).
      # NO command override needed if base already sets charset.

volumes:
  # Nginx/Certbot stores SSL certificates here
  nginx_secrets:

networks:
  donbass-post-network:
    driver: bridge
